<div id="orderModal" class="modal">
  <div class="modal__inner">
    <h3 class="modal__title" data-i18n="order_form_title">Złóż zamówienie</h3>

        <input type="text" name="name" required>
      </div>
      <div class="form-group">

        <input type="tel" name="phone" required>
      </div>
      <div class="form-group">
        <label data-i18n="email">Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label data-i18n="address">Adres dostawy</label>
        <textarea name="address" required></textarea>
      </div>
      <div class="form-group">
        <label data-i18n="notes">Uwagi</label>
        <textarea name="notes"></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn--ghost" onclick="closeOrderModal()" data-i18n="cancel">Anuluj</button>
        <button type="submit" class="btn btn--primary" data-i18n="order_via_telegram">Wyślij zamówienie</button>
      </div>
    </form>
  </div>
</div>

<script>
// Pre-set model filter from URL
const urlParams = new URLSearchParams(window.location.search);
const modelParam = urlParams.get('model');
if (modelParam) {
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      STATE.filters.model = modelParam;
      applyFilters();
      const radio = document.querySelector(`input[name="model"][value="${modelParam}"]`);
      if (radio) radio.checked = true;
    }, 200);
  });
}
</script>
<script src="app.js"></script>

<script>
function hidePageLoader(){
  var loader=document.getElementById('pageLoader');
  if(loader){loader.style.opacity='0';setTimeout(function(){loader.style.display='none';},500);}
}
// Multiple events to ensure loader hides
document.addEventListener('DOMContentLoaded',function(){setTimeout(hidePageLoader,500);});
window.addEventListener('load',hidePageLoader);
// BACKUP - max 2 sekundy potem ZAWSZE schowaj loader (nawet jak coś zawiesi)
setTimeout(hidePageLoader,2000);
</script>
